<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- LCML 图标（深色）：两块方块叠成“日”字，上方橙色方块正被放上去，寓意“来日创造”。 -->
  <rect width="256" height="256" rx="56" fill="#1F2A44"/>
  <!-- 下方方块：已经造好的世界 -->
  <path d="M128 116 176.5 144 128 172 79.5 144Z" fill="#FFFFFF"/>
  <path d="M79.5 144 128 172V228L79.5 200Z" fill="#DCD6E6"/>
  <path d="M128 172 176.5 144V200L128 228Z" fill="#A9A3BF"/>
  <!-- 上方方块落下前的投影 -->
  <path d="M128 126 166 144 128 162 90 144Z" fill="#000" opacity="0.16"/>
  <!-- 上方方块：来日（太阳），倾斜表示正在放置 -->
  <g transform="rotate(-10 128 84)">
    <path d="M128 28 176.5 56 128 84 79.5 56Z" fill="#FFC07A"/>
    <path d="M79.5 56 128 84V140L79.5 112Z" fill="#FF8A3D"/>
    <path d="M128 84 176.5 56V112L128 140Z" fill="#E0662A"/>
  </g>
</svg>
